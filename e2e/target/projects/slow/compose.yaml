# Up long et déterministe (remplace le téléchargement de postgres:17 du test
# manuel) : `web` attend que `db` soit sain, ce qui prend 40 s. Son image
# (busybox:1.36) est retirée avant le test pour que up la télécharge.
services:
  db:
    image: busybox:1.37
    command: sh -c "sleep 40; touch /tmp/ready; sleep 1d"
    stop_grace_period: 1s
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      retries: 120
  web:
    image: busybox:1.36
    command: sleep 1d
    stop_grace_period: 1s
    depends_on:
      db:
        condition: service_healthy
