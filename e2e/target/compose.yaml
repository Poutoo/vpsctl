# Lance la cible des tests E2E : `docker compose -f e2e/target/compose.yaml up -d --build --wait`
# (fait par e2e/scripts/target.ts). SSH n'écoute que sur la boucle locale du poste.
name: atlas-e2e

services:
  target:
    build: .
    image: atlas-e2e-target
    container_name: atlas-e2e-target
    hostname: atlas-e2e
    # Nécessaire au démon Docker imbriqué.
    privileged: true
    ports:
      - "127.0.0.1:${E2E_SSH_PORT:-2222}:22"
    volumes:
      # Images et volumes du Docker imbriqué : gardés d'un lancement à l'autre.
      - docker-data:/var/lib/docker
      - ../.cache/ssh/id_ed25519.pub:/e2e/authorized_keys:ro
      - ./projects:/e2e/projects:ro
      - ./seed.sh:/e2e/seed.sh:ro
      - ./seed-editor.sh:/e2e/seed-editor.sh:ro
    healthcheck:
      test:
        ["CMD-SHELL", "docker info >/dev/null 2>&1 && pgrep -x sshd >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  docker-data:
