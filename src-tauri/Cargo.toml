[package]
name = "vpsctl"
version = "1.2.0"
description = "Contrôle d'un VPS Linux via SSH"
authors = ["Poutoo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vpsctl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
keyring = "4.2.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
thiserror = "2.0.21"
ts-rs = "12.0.1"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1.9.1"
tokio = { version = "1.53.2", features = ["net", "time", "sync", "rt", "macros", "fs", "io-util"] }

[dev-dependencies]
# Temps virtuel pour les tests de la présence Discord (relances, limite de fréquence).
tokio = { version = "1.53.2", features = ["test-util"] }


# Build de publication : https://tauri.app/concept/size/#cargo-configuration
# - opt-level 3 plutôt que "s" : chiffrement SSH et transferts SFTP en
#   profitent ;
# - pas de panic = "abort" : une panique dans une tâche (flux, transfert)
#   n'arrête que cette tâche au lieu de tuer l'application sans le
#   nettoyage de fermeture.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
